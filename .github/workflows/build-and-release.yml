name: Build imvideo and release implayer

on:
  push:
  workflow_dispatch:

concurrency:
  group: imvideo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CLANG_FORMAT_VERSION: "22.1.8"
  CONAN_VERSION: "2.31.1"
  CONAN_HOME: ${{ github.workspace }}/.conan2
  EMSDK_VERSION: "4.0.10"

jobs:
  format:
    name: Check clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install clang-format
        run: python -m pip install "clang-format==${{ env.CLANG_FORMAT_VERSION }}"

      - name: Check C++ formatting
        run: python tools/format.py

  build:
    name: Build imvideo (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            conan_args: >-
              --conf tools.system.package_manager:mode=install
              --conf tools.system.package_manager:sudo=True
          - name: macOS arm64
            runner: macos-latest
            conan_args: ""
          - name: Windows x86_64
            runner: windows-latest
            conan_args: >-
              --settings compiler.runtime=static
              --options ffmpeg/*:with_ssl=False

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Conan
        run: python -m pip install "conan==${{ env.CONAN_VERSION }}"

      - name: Create Conan profile
        run: conan profile detect --force

      # Conan's package cache contains the expensive FFmpeg dependency binaries.
      # Dependency manifests define the stable core cache. A Windows tag uses a
      # separate key so it can extend that cache with the implayer dependencies.
      - name: Define Conan package cache key
        id: conan_cache_key
        shell: bash
        run: >-
          echo "value=conan-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.py', 'example/implayer/conanfile.py') }}-${{ runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && 'release' || 'core' }}"
          >> "$GITHUB_OUTPUT"

      - name: Restore Conan package cache
        id: conan_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: ${{ steps.conan_cache_key.outputs.value }}
          restore-keys: |
            conan-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.py', 'example/implayer/conanfile.py') }}-
            conan-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CONAN_VERSION }}-

      - name: Build, test, and package imvideo
        run: >-
          conan create .
          --settings build_type=Release
          --options "*:shared=False"
          --conf tools.cmake.cmaketoolchain:generator=Ninja
          --build=missing
          ${{ matrix.conan_args }}

      - name: Verify release tag matches the package version
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = conan inspect . --format=json | ConvertFrom-Json
          $expectedTag = "v$($metadata.version)"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Tag $env:RELEASE_TAG does not match Conan package version $($metadata.version); expected $expectedTag."
          }

      - name: Install implayer dependencies
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        working-directory: example/implayer
        run: >-
          conan install . -of build
          --settings build_type=Release
          --settings compiler.runtime=static
          --options "*:shared=False"
          --options ffmpeg/*:with_ssl=False
          --conf tools.cmake.cmaketoolchain:generator=Ninja
          --build=missing

      - name: Configure implayer
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        working-directory: example/implayer
        run: cmake --preset conan-release

      - name: Build implayer
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        working-directory: example/implayer
        run: cmake --build --preset conan-release

      - name: Verify and package implayer
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "example/implayer/build"
          $executables = @(Get-ChildItem $buildDir -Filter "implayer.exe" -File -Recurse)
          if ($executables.Count -ne 1) {
            throw "Expected one implayer.exe, found $($executables.Count)."
          }

          $dependencies = & dumpbin /DEPENDENTS $executables[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin failed with exit code $LASTEXITCODE."
          }
          $unexpectedPattern = '(?i)\b(?:avcodec|avformat|avutil|avfilter|swscale|swresample|glfw|msvcp|vcruntime|ucrtbase|concrt)\S*\.dll\b'
          $unexpected = $dependencies | Select-String -Pattern $unexpectedPattern
          if ($unexpected) {
            throw "Unexpected non-system runtime dependency: $($unexpected -join ', ')"
          }
          $dependencies | Write-Host

          $stageDir = Join-Path $env:RUNNER_TEMP "implayer-windows-x86_64"
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null
          Copy-Item $executables[0].FullName -Destination (Join-Path $stageDir "implayer.exe")
          Copy-Item LICENSE -Destination $stageDir

          $archive = Join-Path $distDir "implayer-windows-x86_64.zip"
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  implayer-windows-x86_64.zip" |
            Set-Content (Join-Path $distDir "implayer-windows-x86_64.sha256") -Encoding ascii

      - name: Upload Windows implayer package
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: implayer-windows-x86_64
          path: |
            dist/implayer-windows-x86_64.zip
            dist/implayer-windows-x86_64.sha256
          if-no-files-found: error
          retention-days: 14

      # Keep reusable recipes and binary packages, but omit disposable build
      # trees, downloaded archives, sources, and temporary files from the cache.
      - name: Prune disposable Conan cache data
        if: always()
        run: conan cache clean "*" --source --build --download --temp

      - name: Save Conan package cache
        if: always() && steps.conan_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: ${{ steps.conan_cache_key.outputs.value }}

  wasm:
    name: Build and test imvideo (WASM)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check out SDK installer
        uses: actions/checkout@v6
        with:
          repository: emscripten-core/emsdk
          ref: 1693ce7359fc9694f198694f902a2cc061239b86
          path: build/emsdk
          persist-credentials: false

      - name: Install Emscripten
        run: |
          build/emsdk/emsdk install "$EMSDK_VERSION"
          build/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Install build and browser tools
        run: |
          python -m pip install "conan==${{ env.CONAN_VERSION }}" cmake ninja -r tests/wasm/requirements.txt
          python -m playwright install --with-deps chromium
          conan profile detect --force

      - name: Restore WASM Conan cache
        id: wasm_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: conan-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CONAN_VERSION }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('conanfile.py', 'profiles/emscripten') }}
          restore-keys: |
            conan-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CONAN_VERSION }}-${{ env.EMSDK_VERSION }}-

      - name: Build and package WASM library
        shell: bash
        run: |
          source build/emsdk/emsdk_env.sh
          conan create . -pr:b default -pr:h profiles/emscripten -b missing --options "*:shared=False"

      - name: Build installed-package consumer
        shell: bash
        run: |
          source build/emsdk/emsdk_env.sh
          package_reference="$(conan inspect . --format=json | python -c 'import json, sys; print("{name}/{version}".format(**json.load(sys.stdin)))')"
          conan test tests/wasm "$package_reference" -pr:b default -pr:h profiles/emscripten

      - name: Run browser integration tests
        run: python tests/wasm/run.py build/wasm-tests --results build/wasm-results

      - name: Upload WASM test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-results
          path: |
            build/wasm-results/
            build/wasm-tests/runtime.html
            build/wasm-tests/wasm_tests.*
          if-no-files-found: warn
          retention-days: 14

      - name: Prune disposable WASM cache data
        if: always() && steps.wasm_cache.outcome == 'success'
        run: conan cache clean "*" --source --build --download --temp

      - name: Save WASM Conan cache
        if: always() && steps.wasm_cache.outcome == 'success' && steps.wasm_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: conan-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CONAN_VERSION }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('conanfile.py', 'profiles/emscripten') }}

  release:
    name: Publish Windows implayer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, build, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v7
        with:
          name: implayer-windows-x86_64
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            dist/implayer-windows-x86_64.zip
            dist/implayer-windows-x86_64.sha256
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes
          fi
