name: Release implayer for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-implayer-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_windows:
    name: Build Windows x86_64 package
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Conan
        run: python -m pip install "conan==2.31.1"

      - name: Create Conan profile
        run: conan profile detect --force

      - name: Build and test imvideo package
        run: >-
          conan create . -s build_type=Release
          -s compiler.runtime=static -o "*:shared=False" -b missing

      - name: Install implayer dependencies
        working-directory: example/implayer
        run: >-
          conan install . -of build -s build_type=Release
          -s compiler.runtime=static -o "*:shared=False" -b missing

      - name: Configure implayer
        working-directory: example/implayer
        run: cmake --preset conan-release

      - name: Build implayer
        working-directory: example/implayer
        run: cmake --build --preset conan-release

      - name: Verify and stage implayer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          $buildDir = Join-Path $env:GITHUB_WORKSPACE "example/implayer/build"
          $executables = @(Get-ChildItem $buildDir -Filter "implayer.exe" -File -Recurse)
          if ($executables.Count -ne 1) {
            throw "Expected one implayer.exe, found $($executables.Count)."
          }
          $dependencies = & dumpbin /DEPENDENTS $executables[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin failed with exit code $LASTEXITCODE."
          }
          $unexpectedPattern = '(?i)\b(?:avcodec|avformat|avutil|avfilter|swscale|swresample|glfw|msvcp|vcruntime|ucrtbase|concrt)\S*\.dll\b'
          $unexpected = $dependencies | Select-String -Pattern $unexpectedPattern
          if ($unexpected) {
            throw "Unexpected non-system runtime dependency: $($unexpected -join ', ')"
          }
          $dependencies | Write-Host

          Copy-Item $executables[0].FullName -Destination (Join-Path $distDir "implayer.exe")
          Copy-Item LICENSE -Destination $distDir

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: implayer-windows-x86_64
          path: |
            dist/implayer.exe
            dist/LICENSE
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build_windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v7
        with:
          name: implayer-windows-x86_64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "dist/implayer.exe"
          "dist/LICENSE"
          --verify-tag
          --generate-notes
